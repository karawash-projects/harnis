{{- if and (not .Values.secrets.existingSecret) (not .Values.secrets.existingMigrationSecret) }}
{{- $url := include "harnis.migrationDatabaseUrl" . }}
# Owner credentials for the migration Job and the maintenance CronJob.
# It is a hook so it exists before the pre-install migration Job runs. Hook
# resources are not removed by `helm uninstall`: delete this Secret by hand
# after uninstalling (see NOTES.txt).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harnis.migrationSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harnis.componentLabels" (list . "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- with $url }}
  MIGRATION_DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.externalDatabase.appPassword }}
  APP_DB_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
