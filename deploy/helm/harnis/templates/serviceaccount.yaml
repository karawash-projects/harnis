{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "harnis.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harnis.componentLabels" (list . "api") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Pods that need the token (the API and the sandbox reaper) opt in.
automountServiceAccountToken: false
{{- end }}
