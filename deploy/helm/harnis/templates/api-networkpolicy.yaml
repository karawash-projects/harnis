{{- if .Values.apiNetworkPolicy.enabled }}
{{- $np := .Values.apiNetworkPolicy }}
{{- /* Kubernetes API server peers: explicit, else the endpoints of the
  `kubernetes` Service looked up at install time (empty in `helm template`). */}}
{{- $kubeApiPeers := $np.kubeApiServer.to }}
{{- if not $kubeApiPeers }}
{{- $kubeApiPeers = list }}
{{- $eps := lookup "v1" "Endpoints" "default" "kubernetes" }}
{{- if $eps }}
{{- range $subset := ($eps.subsets | default list) }}
{{- range $addr := ($subset.addresses | default list) }}
{{- $kubeApiPeers = append $kubeApiPeers (dict "ipBlock" (dict "cidr" (printf "%s/32" $addr.ip))) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
# Default-deny for the API Pods, then allow only what Harnis needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "harnis.componentName" (list . "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harnis.componentLabels" (list . "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "harnis.apiSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with $np.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # Cluster DNS.
    - to:
        - namespaceSelector:
            {{- toYaml $np.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $np.dns.podSelector | nindent 12 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with $np.postgres.to }}
    # Postgres.
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $np.postgres.port }}
          protocol: TCP
    {{- end }}
    {{- with $np.redis.to }}
    # Redis.
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $np.redis.port }}
          protocol: TCP
    {{- end }}
    {{- with $kubeApiPeers }}
    # Kubernetes API server (sandbox Pods).
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- range $np.kubeApiServer.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- with $np.https.to }}
    # Model providers and other HTTPS APIs.
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: 443
          protocol: TCP
    {{- end }}
    {{- with $np.otlp.to }}
    # OTLP collector.
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- range $np.otlp.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
