{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "harnis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harnis.componentLabels" (list . "api") | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "harnis.apiSelectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      bearerTokenSecret:
        name: {{ default (include "harnis.fullname" .) .Values.secrets.existingSecret }}
        key: METRICS_TOKEN
{{- end }}
