{{- if not .Values.secrets.existingSecret }}
{{- $sec := .Values.secrets }}
{{- $db := include "harnis.databaseUrl" . }}
{{- $redis := include "harnis.redisUrl" . }}
# Settings the API needs at runtime. Owner database credentials are NOT here:
# they live in the separate migration Secret (see migration-secret.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harnis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harnis.componentLabels" (list . "api") | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ include "harnis.jwtSecret" . | quote }}
  {{- if .Values.metrics.enabled }}
  METRICS_TOKEN: {{ include "harnis.metricsToken" . | quote }}
  {{- end }}
  {{- with $db }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with $redis }}
  REDIS_URL: {{ . | quote }}
  {{- end }}
  {{- with $sec.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $sec.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $sec.geminiApiKey }}
  GEMINI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $sec.awsAccessKeyId }}
  AWS_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with $sec.awsSecretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with $sec.alertWebhookUrl }}
  ALERT_WEBHOOK_URL: {{ . | quote }}
  {{- end }}
  {{- range $key, $value := $sec.extra }}
  {{ $key }}: {{ toString $value | quote }}
  {{- end }}
{{- end }}
