# Throwaway Postgres for the local kind cluster ONLY. Data lives in an
# emptyDir and is lost when the Pod is replaced. The passwords are local
# test values that deploy/local-k8s/values-kind.yaml also uses.
apiVersion: v1
kind: Namespace
metadata:
  name: harnis-deps
  labels:
    app.kubernetes.io/part-of: harnis-local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: harnis-deps
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: harnis-local
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: harnis-local
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: harnis
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "harnis", "-h", "127.0.0.1"]
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "harnis", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: harnis-deps
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: harnis-local
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
