[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harnis-plugin-tickets"
version = "0.1.0"
description = "Example Harnis plugin: a ticket-triage agent with search and create-ticket tools."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["harnis"]

# Harnis loads this when PLUGINS=tickets (the entry-point name below).
[project.entry-points."harnis.plugins"]
tickets = "harnis_tickets:register"
