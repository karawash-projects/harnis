name: docs

# Builds the documentation site on every pull request (fails on broken links)
# and publishes it to GitHub Pages from main.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", "mkdocs.yml", "scripts/build_docs.py", "harnis/static/favicon.svg",
            ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "README.md", "mkdocs.yml", "scripts/build_docs.py", "harnis/static/favicon.svg",
            ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python -m pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"
      - run: python scripts/build_docs.py
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with: { path: site }

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
