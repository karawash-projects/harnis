# End-to-end test of the Helm chart on a kind cluster: builds both images,
# loads them into kind, deploys Postgres + Redis + Harnis with
# deploy/local-k8s/values-kind.yaml (mock model), and runs the full
# scripts/harnis_check.py feature check against it (sandbox commands run as
# Pods). The same commands work locally: python scripts/k8s_local.py up / check.
name: k8s-e2e
on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "harnis/**"
      - "scripts/**"
      - "Dockerfile"
      - "Dockerfile.sandbox"
      - "pyproject.toml"
      - ".github/workflows/k8s-e2e.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "harnis/**"
      - "scripts/**"
      - "Dockerfile"
      - "Dockerfile.sandbox"
      - "pyproject.toml"
      - ".github/workflows/k8s-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k8s-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: azure/setup-helm@v5
      # Installs kind and kubectl only; scripts/k8s_local.py creates the
      # cluster from deploy/local-k8s/kind-config.yaml, as it does locally.
      - uses: helm/kind-action@v1
        with:
          install_only: true
          # kind's default CNI enforces NetworkPolicy only from v0.24; older
          # releases make the sandbox's network isolation check refuse every
          # command (fail closed). v0.33.0 is the version the project tested.
          version: v0.33.0

      - name: Lint and render the chart with the kind values
        run: |
          helm lint --strict deploy/helm/harnis -f deploy/local-k8s/values-kind.yaml
          helm template harnis deploy/helm/harnis -n harnis -f deploy/local-k8s/values-kind.yaml > /dev/null

      - name: Cluster, images, dependencies and release
        run: python scripts/k8s_local.py up

      - name: End-to-end feature check
        shell: bash
        run: |
          set -o pipefail
          python scripts/k8s_local.py check --report harnis-check-kind.json 2>&1 | tee harnis-check-kind.log

      - name: Show failures as annotations
        if: failure()
        shell: bash
        run: |
          # Annotations are readable through the API and the run summary
          # without downloading logs.
          python - <<'PY'
          import json, pathlib
          def esc(s):
              return s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          def title(s):
              return esc(s).replace(":", "%3A").replace(",", "%2C")
          rep = pathlib.Path("harnis-check-kind.json")
          if rep.exists():
              fails = [r for r in json.loads(rep.read_text())["results"] if r["status"] == "FAIL"]
              for r in fails[:8]:
                  print(f"::error title={title('check failed - ' + r['group'] + ' / ' + r['check'])}::{esc(r['detail'][:900])}")
          log = pathlib.Path("harnis-check-kind.log")
          if log.exists():
              tail = "\n".join(log.read_text(errors="replace").splitlines()[-40:])
              print(f"::error title=feature check output (last 40 lines)::{esc(tail)}")
          PY

      - name: Upload the feature check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harnis-check-kind
          path: |
            harnis-check-kind.json
            harnis-check-kind.log
          if-no-files-found: ignore

      - name: Cluster diagnostics
        if: failure()
        shell: bash
        run: |
          python scripts/k8s_local.py debug 2>&1 | tee k8s-debug.log
          python -c "import pathlib; t='\n'.join(pathlib.Path('k8s-debug.log').read_text(errors='replace').splitlines()[-60:]); print('::warning title=cluster diagnostics (last 60 lines)::' + t.replace('%','%25').replace('\r','').replace('\n','%0A'))"

      - name: Delete the cluster
        if: always()
        run: python scripts/k8s_local.py down
