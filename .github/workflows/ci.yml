name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  # Unit tests on all three operating systems, using the same task runner a
  # developer uses. Service-backed tests skip themselves where no services run.
  unit:
    strategy:
      fail-fast: false
      matrix:
        # The labels name the required status checks ("unit (ubuntu-latest, 3.11)"),
        # so they stay as they are; Linux runs on a pinned image.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
        # GitHub's macOS runners are often short of capacity, so macOS runs one
        # Python version; Linux and Windows cover both.
        exclude:
          - { os: macos-latest, python: "3.11" }
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - run: python tasks.py install
      - run: python tasks.py test unit

  # Full suite (Postgres RLS, API end to end, Docker sandbox) and the red team.
  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: harnis }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        # Valkey, as in the local stack (the cache's brute-force fallback).
        image: valkey/valkey:9.0.7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 3s --health-retries 20
      redis-search:
        # Redis 8 (search engine included), only for the cache's vector-index path.
        image: redis:8.4
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python tasks.py install
      - run: python tasks.py sandbox-image
      - run: python tasks.py test all
      - name: semantic cache on a vector index (Redis 8) and on the fallback (Valkey)
        env:
          HARNIS_TEST_VECTOR_REDIS_URL: redis://localhost:6380/0
          HARNIS_TEST_PLAIN_REDIS_URL: redis://localhost:6379/0
        run: |
          .venv/bin/python -m pytest -v -rs tests/test_cache_backends.py -p no:cacheprovider | tee cache.log
          grep -q " 2 passed" cache.log && ! grep -q "skipped" cache.log
      # The optional psycopg driver (DB_DRIVER=psycopg) keeps passing the same suite.
      - name: integration tests on the psycopg driver
        env: { DB_DRIVER: psycopg }
        run: |
          .venv/bin/python -m pip install -q -e ".[psycopg]"
          python tasks.py test integration
      - name: red team against a live API
        env: { LLM_PROVIDERS: mock, WORKSPACES_DIR: /tmp/ws }
        run: |
          python tasks.py migrate
          .venv/bin/python -m harnis.api & sleep 5
          python tasks.py redteam
          python tasks.py eval -- --providers mock
      - run: docker build -t harnis:ci .

  # Encrypted connections to PostgreSQL with both drivers: sslmode require,
  # verify-ca and verify-full, an untrusted CA and a wrong host name.
  postgres-tls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - name: TLS-enabled PostgreSQL with test certificates
        run: |
          scripts/tls_test_certs.sh "$RUNNER_TEMP/tls"
          docker run -d --name pg-tls -p 5433:5432 -e POSTGRES_PASSWORD=postgres \
            -v "$RUNNER_TEMP/tls:/tls:ro" --entrypoint bash postgres:16 -c '
              cp /tls/server.crt /tls/server.key /var/lib/postgresql/ &&
              chown postgres /var/lib/postgresql/server.* && chmod 600 /var/lib/postgresql/server.key &&
              exec docker-entrypoint.sh postgres -c ssl=on \
                -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key'
          # TCP, not the socket: during first-time setup a temporary server listens on the socket only.
          for i in $(seq 1 60); do docker exec pg-tls pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break; sleep 1; done
          docker exec pg-tls pg_isready -h 127.0.0.1 -U postgres
      - run: python -m pip install -q -e ".[dev,psycopg]"
      - name: TLS tests (pgtern and psycopg)
        env:
          HARNIS_TEST_TLS_DSN: postgresql://postgres:postgres@localhost:5433/postgres
          HARNIS_TEST_TLS_CA: ${{ runner.temp }}/tls/ca.crt
          HARNIS_TEST_TLS_OTHER_CA: ${{ runner.temp }}/tls/other-ca.crt
        run: |
          python -m pytest -v -rs tests/test_pg_tls.py -p no:cacheprovider | tee tls.log
          # Every case on both drivers must have run: a skip here would hide a missing driver.
          grep -q " 12 passed" tls.log && ! grep -q "skipped" tls.log

  # Every commit in a pull request must carry a Signed-off-by line (see CONTRIBUTING.md).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Check sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            # Bot commits (Dependabot) carry no sign-off; the DCO is for people.
            case "$(git log -1 --format='%an' "$c")" in *"[bot]") continue ;; esac
            if ! git log -1 --format=%B "$c" | grep -qF "Signed-off-by: $author"; then
              echo "::error::commit $c is not signed off by its author ($author)"
              missing=1
            fi
          done
          exit $missing

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint --strict deploy/helm/harnis
      - name: more than one replica needs shared storage; the maintenance job is not the API
        run: |
          set -euo pipefail
          if helm template h deploy/helm/harnis -n harnis --set api.replicaCount=2 >/dev/null 2>err.txt; then
            echo "expected the render to fail without shared workspace storage"; exit 1
          fi
          grep -q "shared workspace storage" err.txt
          helm template h deploy/helm/harnis -n harnis --set api.replicaCount=2 \
            --set workspaces.persistence.enabled=true >/dev/null
          # The CronJob loads ENV=production but not the API's secrets: it must run as a job.
          helm template h deploy/helm/harnis -n harnis | grep -A1 "name: COMPONENT" | grep -q '"job"'
      - name: turn workers render only when enabled, and need shared storage
        run: |
          set -euo pipefail
          helm template h deploy/helm/harnis -n harnis > default.yaml
          if grep -q "harnis.worker" default.yaml; then echo "a worker is rendered by default"; exit 1; fi
          grep -q 'TURN_EXECUTION: "inline"' default.yaml
          if helm template h deploy/helm/harnis -n harnis --set worker.enabled=true >/dev/null 2>err.txt; then
            echo "expected the render to fail: workers need shared workspace storage"; exit 1
          fi
          grep -q "worker.enabled needs shared workspace storage" err.txt
          helm template h deploy/helm/harnis -n harnis --set worker.enabled=true \
            --set workspaces.persistence.enabled=true > worker.yaml
          grep -q 'TURN_EXECUTION: "queue"' worker.yaml
          grep -q '"harnis.worker"' worker.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("worker.yaml")) if d]
          dep = next(d for d in docs if d["kind"] == "Deployment" and d["metadata"]["name"].endswith("worker"))
          spec = dep["spec"]["template"]["spec"]
          assert spec["containers"][0]["command"] == ["python", "-m", "harnis.worker"]
          assert any(v.get("persistentVolumeClaim") for v in spec["volumes"]), "workers must mount the shared workspaces"
          PY
          # Kubernetes rejects duplicate env names: api.extraEnv and worker.extraEnv may both set one.
          helm template h deploy/helm/harnis -n harnis --set worker.enabled=true \
            --set workspaces.persistence.enabled=true \
            --set 'api.extraEnv[0].name=ENV' --set 'api.extraEnv[0].value=development' \
            --set 'worker.extraEnv[0].name=ENV' --set 'worker.extraEnv[0].value=test' > dup.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("dup.yaml")) if d]
          dep = next(d for d in docs if d["kind"] == "Deployment" and d["metadata"]["name"].endswith("worker"))
          env = dep["spec"]["template"]["spec"]["containers"][0]["env"]
          names = [e["name"] for e in env]
          assert len(names) == len(set(names)), names
          assert {e["name"]: e.get("value") for e in env}["ENV"] == "test"
          PY
      - name: database CA bundle and driver settings render where they are used
        run: |
          set -euo pipefail
          helm template h deploy/helm/harnis -n harnis \
            --set externalDatabase.host=db.example --set externalDatabase.appPassword=a \
            --set externalDatabase.ownerPassword=o --set externalDatabase.sslmode=verify-full \
            --set externalDatabase.caSecret.name=harnis-db-ca --set externalDatabase.driver=psycopg > out.yaml
          python3 - <<'PY'
          import base64, yaml
          docs = [d for d in yaml.safe_load_all(open("out.yaml")) if d]
          def pod(d):
              spec = d["spec"]
              if d["kind"] == "CronJob":
                  spec = spec["jobTemplate"]["spec"]
              return spec["template"]["spec"]
          name = lambda d: d["metadata"]["name"]
          api = next(d for d in docs if d["kind"] == "Deployment")
          migrate = next(d for d in docs if d["kind"] == "Job" and name(d).endswith("migrate"))
          maint = next(d for d in docs if d["kind"] == "CronJob" and name(d).endswith("maintenance"))
          for d in (api, migrate, maint):
              spec = pod(d)
              assert any(v.get("secret", {}).get("secretName") == "harnis-db-ca" for v in spec["volumes"]), name(d)
              mounts = spec["containers"][0]["volumeMounts"]
              assert any(m["name"] == "db-ca" and m["mountPath"] == "/etc/harnis/db-ca" for m in mounts), name(d)
          secrets = {name(d): d for d in docs if d["kind"] == "Secret"}
          urls = []
          for d in secrets.values():
              for k, v in {**d.get("stringData", {}), **{k: base64.b64decode(v).decode() for k, v in d.get("data", {}).items()}}.items():
                  if k.endswith("DATABASE_URL"):
                      urls.append(v)
          assert len(urls) == 2 and all("sslmode=verify-full&sslrootcert=/etc/harnis/db-ca/ca.pem" in u for u in urls), urls
          cm = next(d for d in docs if d["kind"] == "ConfigMap" and "DB_DRIVER" in d.get("data", {}))
          assert cm["data"]["DB_DRIVER"] == "psycopg"
          env = {e["name"]: e.get("value") for e in pod(migrate)["containers"][0]["env"]}
          assert env["DB_DRIVER"] == "psycopg"
          print("ok:", len(docs), "objects")
          PY
