version: 2
updates:
  # Python dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      opentelemetry:
        patterns: ["opentelemetry-*"]
      llm-sdks:
        patterns: ["anthropic", "openai", "google-genai", "boto3"]

  # Actions used in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # Base images in Dockerfile and Dockerfile.sandbox.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    commit-message:
      prefix: "docker"
